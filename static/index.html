<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperQuery - Research Paper Chatbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="page">
        <header class="header">
            <h1>PaperQuery</h1>
            <p class="subtitle">Ask questions about a research paper you upload.</p>
        </header>

        <section class="upload-bar">
            <label class="file-label" for="pdfFile">
                <span id="fileName">Choose a PDF</span>
            </label>
            <input type="file" id="pdfFile" accept=".pdf" hidden>
            <button id="uploadBtn" onclick="uploadPDF()">Upload</button>
        </section>
        <section class="papers-section">
            <div class="papers-list" id="papersList"></div>
        </section>
        <p id="uploadStatus" class="upload-status"></p>

        <main class="chat-box" id="chatBox">
            <div class="empty-state" id="emptyState">
                Upload a paper above, then ask a question to get started.
            </div>
        </main>

        <footer class="input-row">
            <input type="text" id="questionInput" placeholder="Ask a question about the paper…">
            <button onclick="sendQuestion()">Send</button>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
